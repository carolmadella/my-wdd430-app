<div class="panel panel-default">
  <div class="panel-body">

    <form #f="ngForm" (ngSubmit)="onSubmit(f)" id="document-edit">
      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="name">Document Title:</label>
          <input required="true"
            type="text"
            name="name"
            #name="ngModel"
            [ngModel]="document?.name"
            id="name"
            class="form-control"
            size="120"
            max="120">
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="description">Document Description:</label>
          <input
            type="text"
            name="description"
            [ngModel]="document?.description"
            id="description"
            class="form-control"
            size="120"
            max="255">
        </div>
      </div>

      <div class="row">
        <div class="col-sm-12 form-group">
          <label for="url">Document URL:</label>
          <input required="true"
            type="text"
            name="url"
            #url="ngModel"
            [ngModel]="document?.url"
            id="url"
            class="form-control"
            size="150"
            max="255">
        </div>
      </div>
      <div *ngIf="name.invalid || url.invalid" class="alert alert-danger">The Document Title and Document URL are required fields.</div>

      <div class="row">
        <div class="col-xs-12 btn-toolbar">
          <button [disabled]="name.invalid || url.invalid" class="btn btn-success" type="submit" >Save</button>
          <button class="btn btn-primary" type="button" (click)="onCancel()">Cancel</button>
        </div>
      </div>

    </form>

  </div>
</div>
